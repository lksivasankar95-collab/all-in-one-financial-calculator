name: shy_calculator
description: All-in-One Financial Calculator - ShyBlack
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Local Storage
  hive_flutter: ^1.1.0

  # Charts
  fl_chart: ^0.68.0

  # Biometric Auth
  local_auth: ^2.2.0

  # Internationalization
  intl: ^0.19.0

  # PDF Export
  pdf: ^3.10.8
  printing: ^5.12.0

  # Excel Export
  excel: ^4.0.3

  # Share
  share_plus: ^7.2.2

  # Path Provider
  path_provider: ^2.1.2

  # Google Fonts
  google_fonts: ^6.2.1

  # UUID Generation
  uuid: ^4.3.3

  # Permission Handler
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0


flutter:
  uses-material-design: true
  assets:
    - assets/icons/

flutter_launcher_icons:
  android: true
  image_path: "assets/icons/logo.png"
  adaptive_icon_foreground: "assets/icons/logo.png"
  adaptive_icon_background: "#0D0D0D"
  adaptive_icon_foreground_inset: 10
  min_sdk_android: 21

flutter_native_splash:
  color: "#000000"
  image: "assets/icons/logo.png"
  android: true
  android_gravity: center
  android_12:
    color: "#000000"
    image: "assets/icons/logo.png"
  fullscreen: true
